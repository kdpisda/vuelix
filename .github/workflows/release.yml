name: Release npm package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:package
      - name: Tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./packages/vuelix/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Publish
        working-directory: packages/vuelix
        run: npm publish --access public --provenance
        env:
          # Only needed until trusted publishing is configured on npmjs.com
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
